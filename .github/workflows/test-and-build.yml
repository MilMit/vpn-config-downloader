name: Test and package on Windows and Linux
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Compile check
        run: python -m compileall -q app tests build
      - name: Unit, integration & security tests
        run: python -m pytest -v
      - name: GUI smoke test (headless Linux)
        if: startsWith(matrix.os, 'ubuntu')
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m tests.gui_smoke
      - name: GUI smoke test (Windows)
        if: startsWith(matrix.os, 'windows')
        run: python -m tests.gui_smoke
      - name: Package native application (including Chromium)
        run: python build/build.py
      - name: Verify built Linux executable smoke launch
        if: startsWith(matrix.os, 'ubuntu')
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 8s ./dist/VPNConfigDownloader/VPNConfigDownloader || test $? -eq 124
      - name: Upload native application
        uses: actions/upload-artifact@v4
        with:
          name: VPNConfigDownloader-${{ matrix.os }}
          path: dist/VPNConfigDownloader/
