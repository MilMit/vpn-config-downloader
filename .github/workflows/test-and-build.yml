name: Test and package on Windows and Linux
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Compile check
        run: python -m compileall -q app tests build
      - name: Unit, integration & security tests
        run: python -m pytest -v
      - name: GUI smoke test (headless Linux)
        if: startsWith(matrix.os, 'ubuntu')
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m tests.gui_smoke
      - name: GUI smoke test (Windows)
        if: startsWith(matrix.os, 'windows')
        run: python -m tests.gui_smoke
      - name: Package native application (including Chromium)
        run: python build/build.py
      - name: Create and verify release archive
        shell: bash
        env:
          PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'snapshot' }}
        run: python build/package.py --version "$PACKAGE_VERSION"
      - name: Verify packaged Linux executable smoke launch
        if: startsWith(matrix.os, 'ubuntu')
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          preview_dir="$(mktemp -d)"
          tar -xzf release/*.tar.gz -C "$preview_dir"
          timeout 8s "$preview_dir/VPNConfigDownloader/VPNConfigDownloader" || test $? -eq 124
      - name: Verify built Windows executable smoke launch
        if: startsWith(matrix.os, 'windows')
        env:
          QT_QPA_PLATFORM: offscreen
        shell: python
        run: |
          import subprocess
          process = subprocess.Popen(['dist/VPNConfigDownloader/VPNConfigDownloader.exe'])
          try:
              process.wait(timeout=8)
          except subprocess.TimeoutExpired:
              process.terminate()
              process.wait(timeout=10)
          else:
              raise SystemExit(f'Application exited before the smoke test completed: {process.returncode}')
      - name: Upload native application
        uses: actions/upload-artifact@v4
        with:
          name: VPNConfigDownloader-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: VPNConfigDownloader-*
          merge-multiple: true
          path: release/
      - name: Generate release checksums
        working-directory: release
        run: sha256sum VPNConfigDownloader-* > SHA256SUMS.txt
      - name: Publish verified beta packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "VPN Config Downloader $RELEASE_TAG" --notes-file RELEASE_NOTES.md --draft --prerelease
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" -eq 3
          gh release edit "$RELEASE_TAG" --draft=false
